<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-browser-titulo>2.º Ano - Recursos Educativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- CABEÇALHO A OCUPAR A LARGURA TOTAL DO ECRÃ -->
  <header class="cabecalho">
    <button class="botao-menu" aria-label="Menu Principal" aria-expanded="false" aria-controls="menu-acordeao"></button>
    
    <div class="marca">
      <div class="marca-sol" aria-hidden="true"></div>
      <div class="marca-texto">
        <h1 data-marca></h1>
        <p data-submarca></p>
      </div>
    </div>

    <button class="botao-seta" aria-label="Voltar"></button>

    <!-- MENU ACORDEÃO (HAMBÚRGUER) -->
    <nav id="menu-acordeao" class="menu-acordeao" aria-hidden="true">
      <div class="menu-acordeao-topo">
        <div class="menu-acordeao-titulo" data-titulo-menu-acordeao></div>
        <div class="menu-acordeao-subtitulo" data-informacao></div>
      </div>
      <div id="menu-anos" class="menu-anos"></div>
    </nav>
  </header>

  <div id="app">
    <!-- ÁREA PRINCIPAL / ANOS -->
    <main class="area-menu">
      <div class="decoracao decoracao-esquerda" aria-hidden="true"></div>
      <div class="decoracao decoracao-direita" aria-hidden="true"></div>

      <div class="titulo-menu">
        <h2 data-titulo-menu></h2>
      </div>

      <section id="anos" class="anos"></section>
    </main>

    <!-- DESTAQUES / JOGOS -->
    <section class="destaques">
      <div class="titulo-destaques">
        <div class="linha"></div>
        <h2><span data-emoji-destaques></span> <span data-titulo-destaques></span></h2>
        <div class="linha"></div>
      </div>

      <div id="jogos" class="jogos"></div>
    </section>

    <!-- RODAPÉ -->
    <footer class="rodape">
      <div class="rodape-item">
        <span class="estrela" data-icone-estrela></span>
        <span data-mensagem></span>
      </div>
      <div class="rodape-item rodape-info">
        <span data-informacao></span>
        <div class="info" data-icone-info></div>
      </div>
    </footer>
  </div>

  <!-- TEMPLATES PARA O JAVASCRIPT -->
  <template id="modelo-ano">
    <div class="ano">
      <button class="botao-ano">
        <div class="icone-ano"></div>
        <div class="texto-ano">
          <div class="nome-ano"></div>
          <div class="idade-ano"></div>
        </div>
      </button>
    </div>
  </template>

  <template id="modelo-menu-ano">
    <button class="menu-ano">
      <div class="menu-ano-icon"></div>
      <span class="menu-ano-nome"></span>
    </button>
  </template>

  <template id="modelo-jogo">
    <div class="jogo" tabindex="0">
      <div class="icone-jogo">
        <img src="" alt="">
      </div>
      <div class="nome-jogo"></div>
      <div class="estrelas"></div>
    </div>
  </template>

  <!-- DADOS E LÓGICA -->
  <script src="dados.js"></script>
  <script>
    function inserirCSS() {
      const estilo = document.createElement("style");

      estilo.textContent = `
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; min-height: 100vh;
  font-family: "Nunito", "Quicksand", "Arial Rounded MT Bold", sans-serif;
}

html {
  background: linear-gradient(180deg, ${DADOS.cores.ceu1} 0%, ${DADOS.cores.ceu2} 19%, #F2F8FC 38%, ${DADOS.cores.fundo} 100%);
  background-attachment: fixed;
}

body { 
  background: transparent; 
  color: ${DADOS.cores.texto}; 
  overflow-x: hidden; 
}

button { font-family: inherit; }

#app {
  min-height: 100vh;
  width: min(100%, ${DADOS.dimensoes.larguraMaxima}px);
  margin: 0 auto;
  padding: 0 0 16px;
  position: relative;
  overflow: hidden;
  background: transparent;
}

.cabecalho {
  position: relative; width: 100%; height: 82px;
  background: linear-gradient(180deg, ${DADOS.cores.headerTopo} 0%, ${DADOS.cores.header} 100%);
  display: flex; align-items: center; justify-content: center;
  border-bottom: 2px solid rgba(255,255,255,.65);
  box-shadow: 0 3px 10px rgba(15,139,211,.12); z-index: 20;
}

.botao-menu, .botao-seta {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 58px; height: 58px; padding: 0; border: 0; border-radius: 50%;
  background: ${DADOS.cores.azulHeader}; cursor: pointer;
  box-shadow: 0 3px 7px rgba(0,0,0,.18);
  transition: transform .12s ease, box-shadow .12s ease; z-index: 25;
}
.botao-menu { left: 18px; }
.botao-seta { right: 18px; }

.botao-menu:active, .botao-seta:active {
  transform: translateY(calc(-50% + 3px)) scale(0.95);
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
}

.botao-menu::before {
  content: ""; position: absolute; width: 56%; height: 56%; left: 22%; top: 22%;
  background-image: url("${DADOS.icons.menu}"); background-size: contain; background-repeat: no-repeat;
}
.botao-seta::before {
  content: ""; position: absolute; width: 58%; height: 58%; left: 21%; top: 21%;
  background-image: url("${DADOS.icons.seta}"); background-size: contain; background-repeat: no-repeat;
}

.marca { display: flex; align-items: center; justify-content: center; gap: 12px; min-width: 0; max-width: 65%; padding: 0 50px; }
.marca-sol { width: 64px; height: 64px; flex: 0 0 64px; background-image: url("${DADOS.icons.cabecalho}"); background-size: contain; background-repeat: no-repeat; background-position: center; }
.marca-texto { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.marca-texto h1 { margin: 0; font-size: clamp(26px, 2.8vw, 42px); line-height: 1.1; font-weight: 900; color: ${DADOS.cores.textoEscuro}; text-shadow: 0 2px 0 rgba(255,255,255,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca-texto p { margin: 3px 0 0; font-size: clamp(12px, 1.1vw, 16px); line-height: 1.1; font-weight: 800; color: ${DADOS.cores.texto}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.menu-acordeao {
  position: absolute; top: 72px; left: 18px; width: 300px; padding: 0;
  background: rgba(255,255,255,.98); border: 2px solid ${DADOS.cores.linha};
  border-top: 4px solid ${DADOS.cores.azulHeader}; border-radius: 0 0 20px 20px;
  box-shadow: 0 10px 25px rgba(15,139,211,.24);
  opacity: 0; visibility: hidden; transform: translateY(-12px) scale(.98);
  transform-origin: top left; transition: opacity .22s ease, transform .22s ease, visibility .22s ease;
  z-index: 30;
}
.menu-acordeao.aberto { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
.menu-acordeao-topo { padding: 15px 18px 13px; background: linear-gradient(180deg, #E6F4FA, #FFFFFF); border-bottom: 1px solid ${DADOS.cores.linha}; }
.menu-acordeao-titulo { font-size: 19px; font-weight: 900; color: ${DADOS.cores.textoEscuro}; }
.menu-acordeao-subtitulo { margin-top: 3px; font-size: 12px; font-weight: 700; color: #0F8BD3; }
.menu-anos { display: flex; flex-direction: column; padding: 8px; gap: 5px; max-height: 60vh; overflow-y: auto; }
.menu-ano {
  width: 100%; min-height: 54px; display: flex; align-items: center; gap: 13px; padding: 6px 11px;
  border: 0; border-radius: 13px; background: #FFFFFF; color: ${DADOS.cores.textoEscuro};
  font-size: 15px; font-weight: 800; text-align: left; cursor: pointer; transition: background .16s ease;
}
.menu-ano:hover { background: #E6F4FA; transform: translateX(3px); }
.menu-ano-icon { width: 45px; height: 45px; flex: 0 0 45px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #F0F9FC; }
.menu-ano-icon img { width: 100%; height: 100%; object-fit: contain; }
.menu-ano-nome { flex: 1; }

.area-menu { position: relative; width: 100%; margin-top: 20px; padding: 0 20px; }
.titulo-menu {
  width: fit-content; margin: 1px auto 19px; padding: 8px 30px;
  border: 2px solid ${DADOS.cores.linha};
  border-radius: 16px;
  background: linear-gradient(180deg, #FFFFFF, ${DADOS.cores.creme});
  box-shadow: 0 3px 7px ${DADOS.cores.sombra};
}
.titulo-menu h2 { margin: 0; font-size: clamp(18px, 1.7vw, 27px); font-weight: 900; color: ${DADOS.cores.textoEscuro}; text-align: center; }

.anos { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; justify-content: center; }

.botao-ano {
  position: relative; width: 100%; height: ${DADOS.dimensoes.alturaAnoDesktop}px;
  padding: 16px 12px; border: 3px solid rgba(255,255,255,.94);
  border-radius: ${DADOS.dimensoes.raioAno}px;
  background: linear-gradient(145deg, var(--cor-1) 0%, var(--cor-2) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  color: #FFFFFF; cursor: pointer; overflow: hidden;
  box-shadow: 0 9px 15px ${DADOS.cores.sombra};
  transition: transform .15s ease, box-shadow .15s ease;
}

.botao-ano::before {
  content: "";
  position: absolute;
  top: -30px;
  left: -30px;
  width: 180px;
  height: 180px;
  background: radial-gradient(circle, rgba(255,255,255,0.38) 0%, rgba(255,255,255,0) 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}

.botao-ano::after {
  content: "";
  position: absolute;
  top: -20px;
  right: -20px;
  width: 130px;
  height: 130px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}

.botao-ano:hover { transform: translateY(-4px); box-shadow: 0 13px 20px ${DADOS.cores.sombraForte}; }

.icone-ano {
  width: 100%;
  height: 65%;
  display: flex; align-items: center; justify-content: center; position: relative; z-index: 1;
  margin-top: 2px;
}
.icone-ano img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 5px 3px rgba(0,0,0,.16)); }

.texto-ano { position: relative; z-index: 1; text-align: center; width: 100%; margin-bottom: 4px; }
.nome-ano { font-size: clamp(20px, 1.8vw, 29px); font-weight: 800; text-shadow: 0 2px 1px rgba(0,0,0,.17); line-height: 1.1; }
.idade-ano { margin-top: 3px; font-size: clamp(13px, 1.2vw, 17px); font-weight: 700; text-shadow: 0 1px 1px rgba(0,0,0,.12); }

.destaques {
  margin: 20px; padding: 23px 28px 25px; border-radius: ${DADOS.dimensoes.raioDestaques}px;
  background: rgba(255,255,255,.93); box-shadow: 0 7px 18px rgba(15,139,211,.10);
}
.titulo-destaques { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 28px; margin: 0 30px 25px; }
.titulo-destaques .linha { height: 3px; background: #96D5F0; border-radius: 99px; }
.titulo-destaques h2 { margin: 0; color: ${DADOS.cores.textoEscuro}; font-size: clamp(19px, 1.65vw, 26px); font-weight: 900; }
.jogos { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px; align-items: start; }
.jogo { display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; }
.icone-jogo { width: ${DADOS.dimensoes.tamanhoIconJogo}px; height: ${DADOS.dimensoes.tamanhoIconJogo}px; display: grid; place-items: center; margin-bottom: 10px; }
.icone-jogo img { width: 100%; height: 100%; object-fit: contain; }
.nome-jogo { margin-top: 0; min-height: 25px; color: ${DADOS.cores.textoEscuro}; font-size: clamp(15px, 1.25vw, 20px); font-weight: 900; }
.estrelas { margin-top: 7px; color: #FFB400; font-size: clamp(15px, 1.15vw, 18px); letter-spacing: 1px; }

.rodape {
  width: calc(100% - 40px); min-height: 53px; margin: 15px 20px 0; padding: 8px 17px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center;
  border: 2px solid ${DADOS.cores.linha}; border-radius: 14px; background: rgba(255,255,255,.78);
  font-size: clamp(11px, 1vw, 14px); font-weight: 800;
}
.rodape-item { display: flex; align-items: center; gap: 8px; }
.rodape-info { justify-content: flex-end; }
.estrela { color: #FFB400; font-size: 25px; }
.info { 
  width: 25px; height: 25px; min-width: 25px; min-height: 25px;
  display: inline-flex; align-items: center; justify-content: center; 
  border-radius: 50% !important; color: #fff; background: ${DADOS.cores.azulHeader}; 
  font-size: 12px; font-weight: 900; overflow: hidden; flex-shrink: 0;
}

@media (max-width: 1024px) {
  .jogos { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 16px; }
}

@media (max-width: 768px) {
  .cabecalho { height: 70px; }
  .botao-menu, .botao-seta { width: 48px; height: 48px; }
  .botao-menu { left: 12px; }
  .botao-seta { right: 12px; }
  .marca { padding: 0 44px; gap: 8px; max-width: 72%; }
  .marca-sol { width: 52px; height: 52px; flex: 0 0 52px; }
  .marca-texto h1 { font-size: 20px; }
  .marca-texto p { font-size: 10px; }
  .menu-acordeao { top: 62px; left: 12px; width: calc(100vw - 24px); max-width: 280px; }
}

@media (max-width: 900px) and (orientation: portrait), (max-width: 600px) {
  .cabecalho { height: 62px; }
  .botao-menu, .botao-seta { width: 42px; height: 42px; }
  .botao-menu { left: 10px; }
  .botao-seta { right: 10px; }
  .marca { padding: 0 38px; gap: 6px; max-width: 70%; }
  .marca-sol { width: 42px; height: 42px; flex: 0 0 42px; }
  .marca-texto h1 { font-size: 16px; }
  .marca-texto p { font-size: 9px; margin-top: 1px; }
  .menu-acordeao { top: 54px; left: 10px; width: calc(100vw - 20px); max-width: 260px; }
  
  .area-menu { padding: 0 16px; }
  .destaques { margin: 15px 16px; padding: 18px 14px; border-radius: 16px; }
  .rodape { width: calc(100% - 32px); margin: 10px 16px 0; padding: 8px 12px; font-size: 11px; }

  .anos { grid-template-columns: 1fr; gap: 10px; width: 100%; }
  .botao-ano { 
    height: 95px; 
    padding: 10px 14px; 
    gap: 12px; 
    flex-direction: row; 
    justify-content: flex-start; 
    align-items: center;
    border-radius: 12px; 
    width: 100%;
  }
  .icone-ano { width: 60px; height: 100%; margin-top: 0; flex: 0 0 60px; }
  .texto-ano { text-align: left; margin-bottom: 0; }
  .nome-ano { font-size: 17px; text-align: left; }
  .idade-ano { font-size: 11px; margin-top: 2px; text-align: left; }
  
  .titulo-destaques { margin: 0 10px 18px; gap: 15px; }
  .jogos { grid-template-columns: repeat(3, 1fr); row-gap: 12px; column-gap: 8px; }
  .nome-jogo { font-size: 11px; min-height: 20px; }
  .estrelas { font-size: 10px; margin-top: 3px; }
  
  .info {
    width: 22px !important;
    height: 22px !important;
    min-width: 22px !important;
    min-height: 22px !important;
    border-radius: 50% !important;
  }
}

/* AJUSTES DO MENU HAMBÚRGUER EXCLUSIVAMENTE PARA TELEMÓVEL HORIZONTAL */
@media (max-height: 550px) and (max-width: 900px) and (orientation: landscape) {
  .menu-acordeao { width: 260px; top: 54px; left: 10px; }
  .menu-acordeao-topo { padding: 6px 12px 4px; }
  .menu-acordeao-titulo { font-size: 15px; }
  .menu-anos { padding: 3px; gap: 2px; overflow-y: visible; max-height: none; }
  .menu-ano { min-height: 34px; padding: 2px 8px; font-size: 12px; border-radius: 8px; gap: 8px; }
  .menu-ano-icon { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 6px; }
}
      `;

      document.head.appendChild(estilo);
    }

    function preencherTextos() {
      if (DADOS.pagina.browserTitulo) {
        document.title = DADOS.pagina.browserTitulo;
      }

      const marca = document.querySelector("[data-marca]");
      const submarca = document.querySelector("[data-submarca]");
      const titulo = document.querySelector("[data-titulo-menu]");
      const mensagem = document.querySelector("[data-mensagem]");
      const informacoes = document.querySelectorAll("[data-informacao]");
      const tituloMenuAcordeao = document.querySelector("[data-titulo-menu-acordeao]");
      const iconeEstrela = document.querySelector("[data-icone-estrela]");
      const iconeInfo = document.querySelector("[data-icone-info]");
      const tituloDestaques = document.querySelector("[data-titulo-destaques]");
      const emojiDestaques = document.querySelector("[data-emoji-destaques]");

      if (marca) marca.textContent = DADOS.pagina.titulo;
      if (submarca) submarca.textContent = DADOS.pagina.subtitulo;
      if (titulo) titulo.textContent = DADOS.pagina.tituloMenu;
      if (mensagem) mensagem.textContent = DADOS.pagina.mensagem;
      if (tituloMenuAcordeao) tituloMenuAcordeao.textContent = DADOS.pagina.tituloMenuAcordeao;
      if (iconeEstrela) iconeEstrela.textContent = DADOS.pagina.iconeEstrela;
      if (iconeInfo) iconeInfo.textContent = DADOS.pagina.iconeInfo;
      if (tituloDestaques) tituloDestaques.textContent = DADOS.pagina.tituloDestaques;
      if (emojiDestaques) emojiDestaques.textContent = DADOS.pagina.emojiDestaques;
      
      informacoes.forEach(el => {
        el.textContent = DADOS.pagina.informacao;
      });
    }

    function criarCartoesAno() {
      const recipiente = document.getElementById("anos");
      const modelo = document.getElementById("modelo-ano");
      if (!recipiente || !modelo) return;

      recipiente.innerHTML = "";
      DADOS.anos.forEach(ano => {
        const cartao = modelo.content.cloneNode(true);
        const botao = cartao.querySelector(".botao-ano");
        const icone = cartao.querySelector(".icone-ano");
        const texto = cartao.querySelector(".nome-ano");
        const idade = cartao.querySelector(".idade-ano");

        botao.style.setProperty("--cor-1", ano.cor);
        botao.style.setProperty("--cor-2", ano.cor2);

        const imagem = document.createElement("img");
        imagem.src = DADOS.icons.anos[ano.icon];
        imagem.alt = ano.nome;
        imagem.draggable = false;
        icone.appendChild(imagem);

        texto.textContent = ano.nome;
        idade.textContent = ano.idade;

        botao.addEventListener("click", () => { window.location.href = ano.pagina; });
        recipiente.appendChild(cartao);
      });
    }

    function criarMenuAnos() {
      const recipiente = document.getElementById("menu-anos");
      const modelo = document.getElementById("modelo-menu-ano");
      if (!recipiente || !modelo) return;

      recipiente.innerHTML = "";
      DADOS.menuAnos.forEach(ano => {
        const item = modelo.content.cloneNode(true);
        const botao = item.querySelector(".menu-ano");
        const icone = item.querySelector(".menu-ano-icon");
        const nome = item.querySelector(".menu-ano-nome");

        const imagem = document.createElement("img");
        imagem.src = DADOS.icons.menuAnos[ano.icon];
        imagem.alt = "";
        imagem.draggable = false;
        icone.appendChild(imagem);

        nome.textContent = ano.nome;
        botao.addEventListener("click", () => { window.location.href = ano.pagina; });
        recipiente.appendChild(item);
      });
    }

    function configurarMenu() {
      const botaoMenu = document.querySelector(".botao-menu");
      const menu = document.querySelector(".menu-acordeao");
      const botaoSeta = document.querySelector(".botao-seta");

      if (botaoMenu && menu) {
        botaoMenu.addEventListener("click", event => {
          event.stopPropagation();
          menu.classList.toggle("aberto");
        });
        document.addEventListener("click", event => {
          if (menu.classList.contains("aberto") && !menu.contains(event.target) && !botaoMenu.contains(event.target)) {
            menu.classList.remove("aberto");
          }
        });
      }

      if (botaoSeta) {
        botaoSeta.addEventListener("click", () => { window.location.href = DADOS.pagina.urlVoltar; });
      }
    }

    function criarDestaques() {
      const recipiente = document.getElementById("jogos");
      const modelo = document.getElementById("modelo-jogo");
      if (!recipiente || !modelo) return;

      recipiente.innerHTML = "";
      DADOS.destaques.forEach(jogo => {
        const item = modelo.content.cloneNode(true);
        const imagem = item.querySelector(".icone-jogo img");
        const nome = item.querySelector(".nome-jogo");
        const estrelas = item.querySelector(".estrelas");

        imagem.src = DADOS.icons.destaques[jogo.icon];
        imagem.alt = jogo.nome;
        imagem.draggable = false;

        nome.textContent = jogo.nome;
        estrelas.textContent = DADOS.pagina.iconeEstrela.repeat(jogo.estrelas);

        if (jogo.pagina) {
          const cartao = item.querySelector(".jogo");
          if (cartao) {
            cartao.addEventListener("click", () => { window.location.href = jogo.pagina; });
          }
        }
        recipiente.appendChild(item);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      inserirCSS();
      preencherTextos();
      criarCartoesAno();
      criarMenuAnos();
      configurarMenu();
      criarDestaques();
    });
  </script>
</body>
</html>
